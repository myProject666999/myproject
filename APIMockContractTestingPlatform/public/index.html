<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Mock与契约测试平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="logo">
                <h1>API Mock平台</h1>
            </div>
            <nav class="nav">
                <a href="#/" class="nav-link active" data-page="home">首页</a>
                <a href="#/apis" class="nav-link" data-page="apis">接口列表</a>
                <a href="#/mock" class="nav-link" data-page="mock">Mock规则</a>
                <a href="#/debug" class="nav-link" data-page="debug">调试请求</a>
                <a href="#/contract" class="nav-link" data-page="contract">契约校验</a>
                <a href="#/logs" class="nav-link" data-page="logs">调用日志</a>
            </nav>
            <div class="user-info" id="userInfo">
                <button class="btn btn-primary" id="loginBtn">登录</button>
            </div>
        </header>

        <main class="main">
            <div id="pageContainer"></div>
        </main>

        <div id="toast" class="toast"></div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>登录</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label>用户名/邮箱</label>
                        <input type="text" id="loginUsername" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">登录</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">
                    没有账号？<a href="#" id="showRegister">立即注册</a>
                </p>
            </div>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>注册</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="regUsername" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="regPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">注册</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">
                    已有账号？<a href="#" id="showLogin">立即登录</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
