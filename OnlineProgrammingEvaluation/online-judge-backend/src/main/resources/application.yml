server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: online-judge
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/online_judge?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

judge:
  work-dir: ./judge/workspace
  sandbox:
    docker-image: judge-sandbox:latest
    cpu-core: 1
    max-time: 10000
    max-memory: 256
    max-output: 16777216
  queue:
    submit-queue: oj:submit:queue
    result-topic: oj:result:topic
    concurrency: 2

jwt:
  secret: online-judge-secret-key-2024-very-long-secret-string
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.oj.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
