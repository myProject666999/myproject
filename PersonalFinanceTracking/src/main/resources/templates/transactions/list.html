<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('流水记录')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/layout :: sidebar('transactions')}"></div>
    <main class="main-content">
    <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-error">❌ <span th:text="${error}"></span></div>

    <div class="page-header">
        <h1>📝 流水记录</h1>
        <a th:href="@{/transactions/add}" class="btn btn-primary">➕ 记一笔</a>
    </div>

    <div class="card">
        <form method="get" style="display: flex; gap: 16px; align-items: end; flex-wrap: wrap;">
            <div class="form-group" style="margin-bottom: 0;">
                <label>开始日期</label>
                <input type="date" name="startDate" th:value="${#temporals.format(startDate, 'yyyy-MM-dd')}" style="width: 180px;">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>结束日期</label>
                <input type="date" name="endDate" th:value="${#temporals.format(endDate, 'yyyy-MM-dd')}" style="width: 180px;">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>类型</label>
                <select name="type" style="width: 140px;">
                    <option value="">全部</option>
                    <option value="income" th:selected="${selectedType == 'income'}">收入</option>
                    <option value="expense" th:selected="${selectedType == 'expense'}">支出</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">筛选</button>
            <a th:href="@{/transactions}" class="btn btn-sm">重置</a>
        </form>
    </div>

    <div class="card">
        <div th:if="${#lists.isEmpty(transactions)}" class="empty-state">
            <div class="icon">📝</div>
            <div>暂无交易记录</div>
            <a th:href="@{/transactions/add}" class="btn btn-primary btn-sm" style="margin-top: 10px;">记一笔</a>
        </div>
        <table th:unless="${#lists.isEmpty(transactions)}">
            <thead>
            <tr>
                <th>日期</th>
                <th>类型</th>
                <th>分类</th>
                <th>账户</th>
                <th>描述</th>
                <th class="text-right">金额</th>
                <th class="text-right">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${#temporals.format(t.transactionDate, 'yyyy-MM-dd')}"></td>
                <td>
                    <span class="badge" th:class="'badge-' + ${t.type}" th:text="${t.type == 'income' ? '收入' : '支出'}"></span>
                </td>
                <td>
                    <span th:text="${categoryService.findById(t.categoryId).icon}"></span>
                    <span th:text="${categoryService.findById(t.categoryId).name}"></span>
                </td>
                <td th:text="${accountService.findById(t.accountId).name}"></td>
                <td th:text="${t.description} ?: '-'"></td>
                <td class="text-right"
                    th:class="'amount-' + ${t.type}">
                    <span th:if="${t.type == 'income'}">+</span>
                    <span th:if="${t.type == 'expense'}">-</span>
                    <span th:text="'¥' + ${t.amount}"></span>
                </td>
                <td class="text-right">
                    <form th:action="@{/transactions/{id}/delete(id=${t.id})}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('确定删除该记录？');">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    </main>
</div>
</body>
</html>
