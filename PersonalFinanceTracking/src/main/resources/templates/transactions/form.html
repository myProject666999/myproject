<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('添加流水')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/layout :: sidebar('add-transaction')}"></div>
    <main class="main-content">
    <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-error">❌ <span th:text="${error}"></span></div>

    <div class="page-header">
        <h1>➕ 添加流水</h1>
        <a th:href="@{/transactions}" class="btn btn-sm">返回列表</a>
    </div>

    <div class="card" style="max-width: 600px;">
        <form th:action="@{/transactions}" method="post" th:object="${transaction}">
            <div class="form-group">
                <label>类型</label>
                <div style="display: flex; gap: 16px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="type" value="expense" checked> 支出
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="type" value="income"> 收入
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>金额</label>
                    <input type="number" step="0.01" name="amount" required placeholder="请输入金额">
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" name="transactionDate" th:value="${#temporals.format(today, 'yyyy-MM-dd')}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>账户</label>
                    <select name="accountId" required>
                        <option value="">请选择账户</option>
                        <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.name + ' (¥' + account.balance + ')'}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select name="categoryId" id="categorySelect" required>
                        <option value="">请选择分类</option>
                        <optgroup label="支出分类" id="expenseGroup">
                            <option th:each="c : ${expenseCategories}" th:value="${c.id}" th:text="${c.icon + ' ' + c.name}"></option>
                        </optgroup>
                        <optgroup label="收入分类" id="incomeGroup" style="display: none;">
                            <option th:each="c : ${incomeCategories}" th:value="${c.id}" th:text="${c.icon + ' ' + c.name}"></option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>描述</label>
                <textarea name="description" rows="3" placeholder="请输入描述（可选）"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">保存记录</button>
        </form>
    </div>

    </main>
</div>

<script>
    document.querySelectorAll('input[name="type"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const expenseGroup = document.getElementById('expenseGroup');
            const incomeGroup = document.getElementById('incomeGroup');
            const categorySelect = document.getElementById('categorySelect');
            categorySelect.value = '';
            if (this.value === 'expense') {
                expenseGroup.style.display = '';
                incomeGroup.style.display = 'none';
            } else {
                expenseGroup.style.display = 'none';
                incomeGroup.style.display = '';
            }
        });
    });
</script>
</body>
</html>
