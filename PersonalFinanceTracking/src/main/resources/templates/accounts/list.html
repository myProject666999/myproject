<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('账户管理')}"></head>
<body>
<div class="container">
    <div th:replace="~{fragments/layout :: sidebar('accounts')}"></div>
    <main class="main-content">
    <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-error">❌ <span th:text="${error}"></span></div>

    <div class="page-header">
        <h1>💳 账户管理</h1>
        <button class="btn btn-primary" onclick="document.getElementById('addForm').style.display='block'">➕ 添加账户</button>
    </div>

    <div class="card" style="margin-bottom: 30px;">
        <div style="text-align: center; padding: 20px 0;">
            <div style="font-size: 14px; color: #718096; margin-bottom: 8px;">💰 总资产</div>
            <div style="font-size: 36px; font-weight: 700; color: #4299e1;" th:text="'¥ ' + ${totalBalance}">¥ 0.00</div>
        </div>
    </div>

    <div class="card" id="addForm" style="display: none; max-width: 500px;">
        <div class="card-header">
            <h2>添加账户</h2>
            <button class="btn btn-sm" onclick="document.getElementById('addForm').style.display='none'">取消</button>
        </div>
        <form th:action="@{/accounts}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>账户名称</label>
                    <input type="text" name="name" required placeholder="如：现金、银行卡">
                </div>
                <div class="form-group">
                    <label>账户类型</label>
                    <select name="type" required>
                        <option value="现金">现金</option>
                        <option value="银行卡">银行卡</option>
                        <option value="支付宝">支付宝</option>
                        <option value="微信">微信</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>初始余额</label>
                    <input type="number" step="0.01" name="balance" value="0">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" name="description" placeholder="可选">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
        </form>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>账户名称</th>
                <th>类型</th>
                <th class="text-right">余额</th>
                <th>备注</th>
                <th class="text-right">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="account : ${accounts}">
                <td th:text="${account.name}"></td>
                <td><span class="badge" th:text="${account.type}"></span></td>
                <td class="text-right" style="font-weight: 600;" th:text="'¥ ' + ${account.balance}"></td>
                <td th:text="${account.description} ?: '-'"></td>
                <td class="text-right">
                    <form th:action="@{/accounts/{id}/delete(id=${account.id})}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('确定删除该账户？相关交易记录也会被删除。');">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    </main>
</div>
</body>
</html>
