<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目工时与人力成本分析系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 40px; }
        .header h1 { font-size: 28px; }
        .header p { margin-top: 8px; opacity: 0.9; }
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 30px; }
        .nav-card { background: white; border-radius: 12px; padding: 30px; text-decoration: none; color: #333; transition: all 0.3s; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .nav-card:hover { transform: translateY(-5px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
        .nav-card h3 { font-size: 20px; margin-bottom: 12px; color: #333; }
        .nav-card p { color: #666; line-height: 1.6; }
        .nav-card .icon { font-size: 48px; margin-bottom: 16px; }
        .footer { text-align: center; padding: 30px; color: #999; margin-top: 50px; }
        .timesheet { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .approval { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .dashboard { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .utilization { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .report { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .nav-card.timesheet h3, .nav-card.approval h3, .nav-card.dashboard h3, .nav-card.utilization h3, .nav-card.report h3 { color: white; }
        .nav-card.timesheet p, .nav-card.approval p, .nav-card.dashboard p, .nav-card.utilization p, .nav-card.report p { color: rgba(255,255,255,0.9); }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 项目工时与人力成本分析系统</h1>
        <p>Project Timesheet &amp; Labor Cost Analysis System</p>
    </div>
    <div class="container">
        <h2 style="margin-bottom: 20px; color: #333;">功能导航</h2>
        <div class="nav-grid">
            <a href="timesheet.html" class="nav-card timesheet">
                <div class="icon">⏱️</div>
                <h3>工时填报</h3>
                <p>记录每日工作内容和工时，支持快速填报和历史查看</p>
            </a>
            <a href="approval.html" class="nav-card approval">
                <div class="icon">✅</div>
                <h3>工时审批</h3>
                <p>审批下属提交的工时记录，查看审批历史和状态</p>
            </a>
            <a href="dashboard.html" class="nav-card dashboard">
                <div class="icon">📈</div>
                <h3>项目成本看板</h3>
                <p>实时查看项目成本消耗、预算对比和成本趋势分析</p>
            </a>
            <a href="utilization.html" class="nav-card utilization">
                <div class="icon">📊</div>
                <h3>利用率分析</h3>
                <p>分析人员工时利用率，按部门、项目维度统计</p>
            </a>
            <a href="report.html" class="nav-card report">
                <div class="icon">📋</div>
                <h3>报表中心</h3>
                <p>多维度数据报表，支持Excel导出和自定义查询</p>
            </a>
        </div>
    </div>
    <div class="footer">
        <p>© 2024 项目工时与人力成本分析系统 | 技术栈：Spring Boot + MySQL + Redis</p>
    </div>
</body>
</html>
