server:
  port: 8081

spring:
  application:
    name: grid-governance

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/grid_governance?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

order:
  timeout:
    normal: 24
    high: 12
    urgent: 4

logging:
  level:
    com.community.gridgovernance: info
    org.springframework.web: info
