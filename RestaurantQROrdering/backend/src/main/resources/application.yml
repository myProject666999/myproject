server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: restaurant-ordering
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/restaurant_ordering?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

logging:
  level:
    com.restaurant: debug
    org.hibernate.SQL: debug

app:
  cart:
    prefix: "cart:"
    expire-hours: 24
  table:
    session-prefix: "table:session:"
    expire-hours: 4
