server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: bmi-weight-tracking
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bmi_weight_tracking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.bmi.tracking.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: BMIWeightTrackingSecretKey2024DoNotShareOrExposeThisSecretInProduction
  expiration: 86400000

logging:
  level:
    com.bmi.tracking: debug
    org.springframework.web: info
