<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>章节编辑 - 播客工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">播客工坊</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">章节编辑</h1>
                <p class="text-gray-500" id="episodeTitle">加载中...</p>
            </div>
            <div class="flex items-center space-x-3">
                <a href="#" onclick="goToWorkbench()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">返回工作台</a>
                <a href="#" onclick="goToShowNotes()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Show Notes</a>
                <a href="#" onclick="goToPublish()" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700">发布设置</a>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">添加新章节</h3>
            <form id="chapterForm" onsubmit="addChapter(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">章节名称 *</label>
                        <input type="text" id="chapterTitle" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="输入章节名称" required>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">开始时间 (秒) *</label>
                            <input type="number" id="startTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="0" min="0" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">结束时间 (秒)</label>
                            <input type="number" id="endTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="可选" min="0">
                        </div>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                        <textarea id="chapterDesc" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="章节描述..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">链接 URL</label>
                        <input type="url" id="chapterLink" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="https://...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">图片 URL</label>
                        <input type="url" id="chapterImage" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="https://...">
                    </div>
                </div>
                <div class="mt-4 flex justify-end">
                    <button type="submit" class="px-6 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700">
                        添加章节
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-gray-900">章节列表</h3>
                <span id="chapterCount" class="text-sm text-gray-500">0 个章节</span>
            </div>
            <div id="chaptersContainer" class="space-y-3">
                <div class="text-center py-8 text-gray-500">
                    <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                    </svg>
                    <p>暂无章节</p>
                </div>
            </div>
        </div>
    </main>

    <div id="editModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b">
                <h3 class="text-lg font-semibold text-gray-900">编辑章节</h3>
            </div>
            <div class="px-6 py-4">
                <form id="editForm" onsubmit="updateChapter(event)">
                    <input type="hidden" id="editChapterId">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">章节名称</label>
                            <input type="text" id="editTitle" class="w-full px-3 py-2 border border-gray-300 rounded-lg" required>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">开始时间 (秒)</label>
                                <input type="number" id="editStartTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg" min="0" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">结束时间 (秒)</label>
                                <input type="number" id="editEndTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg" min="0">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                            <textarea id="editDesc" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-end space-x-3">
                        <button type="button" onclick="hideEditModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">取消</button>
                        <button type="submit" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let episodeId = null;
        let chapters = [];

        document.addEventListener('DOMContentLoaded', function() {
            episodeId = window.location.pathname.split('/').pop();
            loadChapters();
        });

        async function loadChapters() {
            try {
                const response = await fetch(`/api/audio/episodes/${episodeId}`);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('episodeTitle').textContent = result.episode.title;
                    chapters = result.chapters || [];
                    renderChapters();
                }
            } catch (err) {
                console.error('加载失败:', err);
            }
        }

        function renderChapters() {
            const container = document.getElementById('chaptersContainer');
            const countEl = document.getElementById('chapterCount');
            
            countEl.textContent = `${chapters.length} 个章节`;

            if (chapters.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                        <p>暂无章节</p>
                    </div>
                `;
                return;
            }

            chapters.sort((a, b) => a.start_time - b.start_time);

            container.innerHTML = chapters.map((chapter, index) => `
                <div class="border rounded-lg p-4 hover:bg-gray-50 transition-colors">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold">
                                ${index + 1}
                            </div>
                            <div>
                                <h4 class="font-medium text-gray-900">${chapter.title}</h4>
                                <div class="flex items-center space-x-4 mt-1 text-sm text-gray-500">
                                    <span class="font-mono">${formatTime(chapter.start_time)}</span>
                                    ${chapter.end_time ? `<span class="font-mono">- ${formatTime(chapter.end_time)}</span>` : ''}
                                    ${chapter.description ? `<span class="truncate max-w-xs">${chapter.description}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="showEditModal(${chapter.id})" class="p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-4m-4-2a2 2 0 01-2-2h-1.586a1 1 0 01-.707-.293l-1.121-1.121a1 1 0 01-.293-.707V11h4z"></path>
                                </svg>
                            </button>
                            <button onclick="deleteChapter(${chapter.id})" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function addChapter(event) {
            event.preventDefault();

            const title = document.getElementById('chapterTitle').value.trim();
            const startTime = parseInt(document.getElementById('startTime').value) || 0;
            const endTime = document.getElementById('endTime').value ? parseInt(document.getElementById('endTime').value) : null;
            const description = document.getElementById('chapterDesc').value.trim();
            const linkUrl = document.getElementById('chapterLink').value.trim();
            const imageUrl = document.getElementById('chapterImage').value.trim();

            try {
                const response = await fetch('/api/edit/chapters', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        episodeId,
                        title,
                        startTime,
                        endTime,
                        description,
                        linkUrl,
                        imageUrl
                    })
                });

                const result = await response.json();
                if (result.success) {
                    document.getElementById('chapterForm').reset();
                    loadChapters();
                }
            } catch (err) {
                console.error('添加章节失败:', err);
                alert('添加章节失败');
            }
        }

        function showEditModal(chapterId) {
            const chapter = chapters.find(c => c.id === chapterId);
            if (!chapter) return;

            document.getElementById('editChapterId').value = chapter.id;
            document.getElementById('editTitle').value = chapter.title;
            document.getElementById('editStartTime').value = chapter.start_time;
            document.getElementById('editEndTime').value = chapter.end_time || '';
            document.getElementById('editDesc').value = chapter.description || '';

            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        }

        function hideEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('flex');
        }

        async function updateChapter(event) {
            event.preventDefault();

            const chapterId = document.getElementById('editChapterId').value;
            const title = document.getElementById('editTitle').value.trim();
            const startTime = parseInt(document.getElementById('editStartTime').value) || 0;
            const endTime = document.getElementById('editEndTime').value ? parseInt(document.getElementById('editEndTime').value) : null;
            const description = document.getElementById('editDesc').value.trim();

            try {
                const response = await fetch(`/api/edit/chapters/${chapterId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title,
                        startTime,
                        endTime,
                        description
                    })
                });

                const result = await response.json();
                if (result.success) {
                    hideEditModal();
                    loadChapters();
                }
            } catch (err) {
                console.error('更新章节失败:', err);
                alert('更新章节失败');
            }
        }

        async function deleteChapter(chapterId) {
            if (!confirm('确定删除此章节?')) return;

            try {
                const response = await fetch(`/api/edit/chapters/${chapterId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    loadChapters();
                }
            } catch (err) {
                console.error('删除章节失败:', err);
                alert('删除章节失败');
            }
        }

        function formatTime(seconds) {
            if (!seconds) return '00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function goToWorkbench() {
            window.location.href = `/workbench/${episodeId}`;
        }

        function goToShowNotes() {
            window.location.href = `/shownotes/${episodeId}`;
        }

        function goToPublish() {
            window.location.href = `/publish/${episodeId}`;
        }
    </script>
</body>
</html>
