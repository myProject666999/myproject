<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Notes - 播客工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">播客工坊</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Show Notes</h1>
                <p class="text-gray-500" id="episodeTitle">加载中...</p>
            </div>
            <div class="flex items-center space-x-3">
                <a href="#" onclick="goToWorkbench()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">返回工作台</a>
                <a href="#" onclick="goToChapters()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">章节编辑</a>
                <a href="#" onclick="goToPublish()" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700">发布设置</a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-xl shadow-sm border p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">内容编辑</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">摘要</label>
                            <textarea id="summary" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="输入节目摘要..."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">详细内容 (支持 Markdown)</label>
                            <textarea id="content" rows="15" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-mono text-sm" placeholder="## 节目要点

- 要点一
- 要点二

## 链接

- [示例链接](https://example.com)"></textarea>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">语音转写 (Transcription)</h3>
                        <button onclick="generateTranscription()" class="px-3 py-1 text-sm bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200">
                            生成转写
                        </button>
                    </div>
                    <textarea id="transcription" rows="10" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-mono text-sm" placeholder="语音转写内容将显示在这里..."></textarea>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-xl shadow-sm border p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">关键词</h3>
                    <div>
                        <input type="text" id="keywords" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="用逗号分隔多个关键词">
                        <p class="text-xs text-gray-500 mt-2">例如: 科技, 创业, 人工智能</p>
                    </div>
                    <div id="keywordsTags" class="flex flex-wrap gap-2 mt-4">
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">章节预览</h3>
                    <div id="chaptersPreview" class="space-y-3">
                        <p class="text-gray-500 text-sm">暂无章节</p>
                    </div>
                </div>

                <button onclick="saveShowNotes()" class="w-full px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-medium hover:from-indigo-600 hover:to-purple-700 transition-all">
                    保存 Show Notes
                </button>
            </div>
        </div>
    </main>

    <script>
        let episodeId = null;
        let chapters = [];

        document.addEventListener('DOMContentLoaded', function() {
            episodeId = window.location.pathname.split('/').pop();
            loadShowNotes();
            setupKeywords();
        });

        async function loadShowNotes() {
            try {
                const response = await fetch(`/api/audio/episodes/${episodeId}`);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('episodeTitle').textContent = result.episode.title;
                    chapters = result.chapters || [];
                    renderChaptersPreview();

                    if (result.showNotes) {
                        document.getElementById('summary').value = result.showNotes.summary || '';
                        document.getElementById('content').value = result.showNotes.content || '';
                        document.getElementById('transcription').value = result.showNotes.transcription || '';
                        document.getElementById('keywords').value = result.showNotes.keywords || '';
                        renderKeywordsTags();
                    }
                }
            } catch (err) {
                console.error('加载失败:', err);
            }
        }

        function setupKeywords() {
            document.getElementById('keywords').addEventListener('input', function() {
                renderKeywordsTags();
            });
        }

        function renderKeywordsTags() {
            const keywordsStr = document.getElementById('keywords').value;
            const container = document.getElementById('keywordsTags');
            
            if (!keywordsStr.trim()) {
                container.innerHTML = '';
                return;
            }

            const keywords = keywordsStr.split(',').filter(k => k.trim());
            container.innerHTML = keywords.map(keyword => `
                <span class="inline-flex items-center px-3 py-1 bg-indigo-100 text-indigo-700 text-sm rounded-full">
                    ${keyword.trim()}
                </span>
            `).join('');
        }

        function renderChaptersPreview() {
            const container = document.getElementById('chaptersPreview');
            
            if (chapters.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">暂无章节</p>';
                return;
            }

            chapters.sort((a, b) => a.start_time - b.start_time);
            container.innerHTML = chapters.map((chapter, index) => `
                <div class="flex items-start space-x-3 text-sm">
                    <span class="text-gray-400 font-mono whitespace-nowrap">${formatTime(chapter.start_time)}</span>
                    <span class="text-gray-700">${chapter.title}</span>
                </div>
            `).join('');
        }

        async function saveShowNotes() {
            const summary = document.getElementById('summary').value.trim();
            const content = document.getElementById('content').value.trim();
            const transcription = document.getElementById('transcription').value.trim();
            const keywords = document.getElementById('keywords').value.trim();

            try {
                const response = await fetch('/api/edit/shownotes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        episodeId,
                        summary,
                        content,
                        transcription,
                        keywords
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('保存成功!');
                }
            } catch (err) {
                console.error('保存失败:', err);
                alert('保存失败');
            }
        }

        function generateTranscription() {
            alert('语音转写功能需要集成第三方服务 (如 OpenAI Whisper、阿里云录音文件识别等)');
        }

        function formatTime(seconds) {
            if (!seconds) return '00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function goToWorkbench() {
            window.location.href = `/workbench/${episodeId}`;
        }

        function goToChapters() {
            window.location.href = `/chapters/${episodeId}`;
        }

        function goToPublish() {
            window.location.href = `/publish/${episodeId}`;
        }
    </script>
</body>
</html>
