<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频工作台 - 播客工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.7.1/dist/wavesurfer.min.js"></script>
    <style>
        .timeline-marker {
            position: absolute;
            top: 0;
            width: 2px;
            background: #ef4444;
            height: 100%;
            z-index: 10;
        }
        .selection-region {
            position: absolute;
            top: 0;
            background: rgba(99, 102, 241, 0.3);
            border-left: 2px solid #6366f1;
            border-right: 2px solid #6366f1;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">播客工坊</span>
                    </a>
                    <div class="hidden md:ml-10 md:flex md:space-x-8">
                        <a href="/" class="text-gray-500 hover:text-gray-700 inline-flex items-center px-1 pt-1 text-sm font-medium">节目列表</a>
                        <a href="#" class="border-b-2 border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium">音频工作台</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="bg-white rounded-xl shadow-sm border p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900" id="episodeTitle">加载中...</h1>
                    <p class="text-gray-500 mt-1" id="episodeInfo">--:-- / --:--</p>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="#" onclick="goToChapters()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">章节编辑</a>
                    <a href="#" onclick="goToShowNotes()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Show Notes</a>
                    <a href="#" onclick="goToPublish()" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700">发布设置</a>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-900">波形编辑器</h2>
                <div class="flex items-center space-x-2">
                    <button onclick="zoomIn()" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
                        </svg>
                    </button>
                    <button onclick="zoomOut()" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="waveform" class="bg-gray-50 rounded-lg p-4 min-h-[200px]"></div>
            
            <div class="flex items-center justify-center mt-6 space-x-4">
                <button onclick="skipBackward()" class="p-3 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path>
                    </svg>
                </button>
                <button onclick="togglePlay()" id="playBtn" class="p-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-full hover:from-indigo-600 hover:to-purple-700 shadow-lg">
                    <svg id="playIcon" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"></path>
                    </svg>
                    <svg id="pauseIcon" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
                    </svg>
                </button>
                <button onclick="skipForward()" class="p-3 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path>
                    </svg>
                </button>
            </div>
            
            <div class="flex items-center justify-between mt-4 text-sm text-gray-500">
                <span id="currentTime">00:00</span>
                <span id="totalTime">00:00</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow-sm border p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">剪辑工具</h3>
                
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">开始时间 (秒)</label>
                            <input type="number" id="startTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="0" min="0">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">结束时间 (秒)</label>
                            <input type="number" id="endTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="0" min="0">
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap gap-2">
                        <button onclick="setSelection()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">
                            标记选区
                        </button>
                        <button onclick="cutSegment()" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200">
                            删除选区
                        </button>
                        <button onclick="trimAudio()" class="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200">
                            裁剪到选区
                        </button>
                        <button onclick="applyNoiseReduction()" class="px-4 py-2 bg-green-100 text-green-700 rounded-lg hover:bg-green-200">
                            降噪处理
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">章节快速标记</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">章节名称</label>
                        <input type="text" id="chapterTitle" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="输入章节名称">
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm text-gray-500">当前位置:</span>
                        <span id="chapterTime" class="text-sm font-mono text-indigo-600">00:00</span>
                    </div>
                    <button onclick="addChapterAtCurrentTime()" class="w-full px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700">
                        在当前位置添加章节
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-6 mt-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">章节列表</h3>
            <div id="chaptersList" class="space-y-2">
                <p class="text-gray-500 text-center py-4">暂无章节</p>
            </div>
        </div>
    </main>

    <script>
        let wavesurfer = null;
        let episodeId = null;
        let episode = null;
        let isPlaying = false;
        let chapters = [];

        document.addEventListener('DOMContentLoaded', function() {
            episodeId = window.location.pathname.split('/').pop();
            loadEpisode();
        });

        async function loadEpisode() {
            try {
                const response = await fetch(`/api/audio/episodes/${episodeId}`);
                const result = await response.json();
                
                if (result.success) {
                    episode = result.episode;
                    chapters = result.chapters || [];
                    
                    document.getElementById('episodeTitle').textContent = episode.title;
                    document.getElementById('episodeInfo').textContent = formatDuration(episode.duration);
                    
                    if (episode.original_file) {
                        initWaveSurfer();
                    }
                    
                    renderChapters();
                }
            } catch (err) {
                console.error('加载音频失败:', err);
            }
        }

        function initWaveSurfer() {
            wavesurfer = WaveSurfer.create({
                container: '#waveform',
                waveColor: '#6366f1',
                progressColor: '#8b5cf6',
                cursorColor: '#ef4444',
                barWidth: 2,
                barRadius: 3,
                height: 128,
                responsive: true
            });

            wavesurfer.load(`/uploads/${episode.original_file}`);

            wavesurfer.on('ready', () => {
                const duration = wavesurfer.getDuration();
                document.getElementById('totalTime').textContent = formatTime(duration);
                document.getElementById('episodeInfo').textContent = formatDuration(Math.round(duration));
            });

            wavesurfer.on('audioprocess', () => {
                const currentTime = wavesurfer.getCurrentTime();
                document.getElementById('currentTime').textContent = formatTime(currentTime);
                document.getElementById('chapterTime').textContent = formatTime(currentTime);
            });

            wavesurfer.on('finish', () => {
                isPlaying = false;
                updatePlayButton();
            });
        }

        function togglePlay() {
            if (wavesurfer) {
                wavesurfer.playPause();
                isPlaying = !isPlaying;
                updatePlayButton();
            }
        }

        function updatePlayButton() {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function skipBackward() {
            if (wavesurfer) {
                wavesurfer.skip(-5);
            }
        }

        function skipForward() {
            if (wavesurfer) {
                wavesurfer.skip(5);
            }
        }

        function zoomIn() {
            if (wavesurfer) {
                wavesurfer.zoom(wavesurfer.params.minPxPerSec + 10);
            }
        }

        function zoomOut() {
            if (wavesurfer) {
                wavesurfer.zoom(Math.max(10, wavesurfer.params.minPxPerSec - 10));
            }
        }

        function setSelection() {
            const start = parseFloat(document.getElementById('startTime').value) || 0;
            const end = parseFloat(document.getElementById('endTime').value) || 0;
            
            if (wavesurfer && end > start) {
                wavesurfer.seekTo(start / wavesurfer.getDuration());
            }
        }

        async function cutSegment() {
            const start = parseFloat(document.getElementById('startTime').value) || 0;
            const end = parseFloat(document.getElementById('endTime').value) || 0;
            
            if (end <= start) {
                alert('请设置有效的时间范围');
                return;
            }

            try {
                const response = await fetch('/api/edit/edits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        episodeId: episodeId,
                        editType: 'cut',
                        startTime: start,
                        endTime: end,
                        parameters: { action: 'delete' }
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('删除操作已记录');
                }
            } catch (err) {
                console.error('记录剪辑操作失败:', err);
            }
        }

        async function trimAudio() {
            const start = parseFloat(document.getElementById('startTime').value) || 0;
            const end = parseFloat(document.getElementById('endTime').value) || 0;
            
            if (end <= start) {
                alert('请设置有效的时间范围');
                return;
            }

            try {
                const response = await fetch('/api/edit/edits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        episodeId: episodeId,
                        editType: 'trim',
                        startTime: start,
                        endTime: end
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('裁剪操作已记录');
                }
            } catch (err) {
                console.error('记录裁剪操作失败:', err);
            }
        }

        async function applyNoiseReduction() {
            try {
                const response = await fetch('/api/edit/edits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        episodeId: episodeId,
                        editType: 'volume',
                        startTime: 0,
                        parameters: { noiseReduction: true }
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('降噪处理已标记');
                }
            } catch (err) {
                console.error('标记降噪失败:', err);
            }
        }

        async function addChapterAtCurrentTime() {
            const title = document.getElementById('chapterTitle').value.trim();
            if (!title) {
                alert('请输入章节名称');
                return;
            }

            const currentTime = wavesurfer ? Math.round(wavesurfer.getCurrentTime()) : 0;

            try {
                const response = await fetch('/api/edit/chapters', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        episodeId: episodeId,
                        title: title,
                        startTime: currentTime
                    })
                });

                const result = await response.json();
                if (result.success) {
                    document.getElementById('chapterTitle').value = '';
                    loadEpisode();
                } else {
                    alert('添加章节失败: ' + (result.error || '未知错误'));
                }
            } catch (err) {
                console.error('添加章节失败:', err);
                alert('添加章节失败: ' + err.message);
            }
        }

        function renderChapters() {
            const container = document.getElementById('chaptersList');
            
            if (chapters.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">暂无章节</p>';
                return;
            }

            container.innerHTML = chapters.map(chapter => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <div class="flex items-center space-x-3">
                        <span class="px-2 py-1 bg-indigo-100 text-indigo-700 text-sm font-mono rounded">
                            ${formatTime(chapter.start_time)}
                        </span>
                        <span class="font-medium text-gray-900">${chapter.title}</span>
                    </div>
                    <button onclick="seekToChapter(${chapter.start_time})" class="text-indigo-600 hover:text-indigo-800 text-sm">
                        跳转
                    </button>
                </div>
            `).join('');
        }

        function seekToChapter(time) {
            if (wavesurfer) {
                wavesurfer.seekTo(time / wavesurfer.getDuration());
            }
        }

        function formatTime(seconds) {
            if (!seconds) return '00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function formatDuration(seconds) {
            if (!seconds) return '--:--';
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}分${s}秒`;
        }

        function goToChapters() {
            window.location.href = `/chapters/${episodeId}`;
        }

        function goToShowNotes() {
            window.location.href = `/shownotes/${episodeId}`;
        }

        function goToPublish() {
            window.location.href = `/publish/${episodeId}`;
        }
    </script>
</body>
</html>
