server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: subscription-management
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/subscription_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd
    time-zone: Asia/Shanghai

logging:
  level:
    com.subscription: debug
    org.hibernate.SQL: debug
