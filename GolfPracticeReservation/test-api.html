<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>API 测试页面</title>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .result { margin-top: 10px; padding: 10px; background: #f5f5f5; white-space: pre-wrap; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
  </style>
</head>
<body>
  <h1>高尔夫预约系统 API 测试</h1>

  <div class="test-section">
    <h2>1. 测试教练列表</h2>
    <button onclick="testCoaches()">获取教练列表</button>
    <div id="coaches-result" class="result"></div>
  </div>

  <div class="test-section">
    <h2>2. 测试新增教练</h2>
    <button onclick="testAddCoach()">新增教练</button>
    <div id="add-coach-result" class="result"></div>
  </div>

  <div class="test-section">
    <h2>3. 测试球具列表</h2>
    <button onclick="testEquipment()">获取球具列表</button>
    <div id="equipment-result" class="result"></div>
  </div>

  <div class="test-section">
    <h2>4. 测试新增球具</h2>
    <button onclick="testAddEquipment()">新增球具</button>
    <div id="add-equipment-result" class="result"></div>
  </div>

  <div class="test-section">
    <h2>5. 测试卡类型列表</h2>
    <button onclick="testCardTypes()">获取卡类型列表</button>
    <div id="card-types-result" class="result"></div>
  </div>

  <div class="test-section">
    <h2>6. 测试新增卡类型</h2>
    <button onclick="testAddCardType()">新增卡类型</button>
    <div id="add-card-type-result" class="result"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    async function testCoaches() {
      const resultDiv = document.getElementById('coaches-result');
      try {
        const response = await axios.get(`${API_BASE}/coaches`);
        resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
        resultDiv.className = 'result success';
      } catch (error) {
        resultDiv.innerHTML = '错误: ' + (error.response?.data?.message || error.message);
        resultDiv.className = 'result error';
      }
    }

    async function testAddCoach() {
      const resultDiv = document.getElementById('add-coach-result');
      try {
        const coachData = {
          coach_name: '测试教练' + Date.now(),
          phone: '139' + Math.floor(Math.random() * 100000000),
          title: '测试教练',
          specialty: '测试专长',
          price_per_hour: 300,
          status: 1,
          description: '测试描述'
        };
        const response = await axios.post(`${API_BASE}/coaches`, coachData);
        resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
        resultDiv.className = 'result success';
        setTimeout(testCoaches, 500);
      } catch (error) {
        resultDiv.innerHTML = '错误: ' + (error.response?.data?.message || error.message);
        resultDiv.className = 'result error';
      }
    }

    async function testEquipment() {
      const resultDiv = document.getElementById('equipment-result');
      try {
        const response = await axios.get(`${API_BASE}/equipment`);
        resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
        resultDiv.className = 'result success';
      } catch (error) {
        resultDiv.innerHTML = '错误: ' + (error.response?.data?.message || error.message);
        resultDiv.className = 'result error';
      }
    }

    async function testAddEquipment() {
      const resultDiv = document.getElementById('add-equipment-result');
      try {
        const equipmentData = {
          category_id: 1,
          equipment_name: '测试球具' + Date.now(),
          equipment_code: 'TEST-' + Math.floor(Math.random() * 10000),
          brand: 'TestBrand',
          specs: '测试规格',
          rental_price: 100,
          total_quantity: 5,
          available_quantity: 5,
          status: 1,
          description: '测试描述'
        };
        const response = await axios.post(`${API_BASE}/equipment`, equipmentData);
        resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
        resultDiv.className = 'result success';
        setTimeout(testEquipment, 500);
      } catch (error) {
        resultDiv.innerHTML = '错误: ' + (error.response?.data?.message || error.message);
        resultDiv.className = 'result error';
      }
    }

    async function testCardTypes() {
      const resultDiv = document.getElementById('card-types-result');
      try {
        const response = await axios.get(`${API_BASE}/card-types`);
        resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
        resultDiv.className = 'result success';
      } catch (error) {
        resultDiv.innerHTML = '错误: ' + (error.response?.data?.message || error.message);
        resultDiv.className = 'result error';
      }
    }

    async function testAddCardType() {
      const resultDiv = document.getElementById('add-card-type-result');
      try {
        const cardTypeData = {
          card_name: '测试卡' + Date.now(),
          card_type: 'monthly',
          duration_days: 30,
          price: 1000,
          discount: 90,
          status: 1,
          description: '测试描述'
        };
        const response = await axios.post(`${API_BASE}/card-types`, cardTypeData);
        resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
        resultDiv.className = 'result success';
        setTimeout(testCardTypes, 500);
      } catch (error) {
        resultDiv.innerHTML = '错误: ' + (error.response?.data?.message || error.message);
        resultDiv.className = 'result error';
      }
    }
  </script>
</body>
</html>
