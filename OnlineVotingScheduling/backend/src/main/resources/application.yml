server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/online_voting_scheduling?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL5Dialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: c2VjcmV0LWtleS1mb3Itb25saW5lLXZvdGluZy1zY2hlZHVsaW5nLXN5c3RlbS0yMDI0
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    com.votingscheduling: DEBUG
    org.springframework.security: INFO
