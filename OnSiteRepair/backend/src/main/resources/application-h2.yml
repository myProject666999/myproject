spring:
  sql:
    init:
      mode: never
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:onsite_repair;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        shutdown-timeout: 0ms
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
