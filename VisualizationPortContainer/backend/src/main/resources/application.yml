server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: container-yard

  profiles:
    active: dev

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/port_container_yard?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.port.container.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 港口集装箱堆场调度可视化系统API
    description: 港口集装箱堆场调度可视化系统接口文档
    version: 1.0.0
    concat: port-team
    terms-of-service-url: http://localhost:8080
  cors: true
  production: false

logging:
  level:
    root: info
    com.port.container: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 自定义业务配置
port:
  container:
    # 箱位锁定超时时间(秒)
    slot-lock-timeout: 300
    # 任务默认优先级
    default-task-priority: 2
    # 自动分配策略: score_based(综合评分)/first_fit(最先适配)/nearest_exit(靠近出口)/weight_based(重量优先)
    default-allocation-strategy: score_based
    # 翻箱率阈值(超过告警)
    rehandle-rate-threshold: 0.1
    # 吊机作业冲突检测时间范围(分钟)
    crane-conflict-window: 15
