server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/school_cafeteria?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
