version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: price-monitor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: price_monitor
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - monitor-network

  redis:
    image: redis:7-alpine
    container_name: price-monitor-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: price-monitor-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=price_monitor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend/config.yaml:/app/config.yaml
    networks:
      - monitor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: price-monitor-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - monitor-network

volumes:
  mysql_data:
  redis_data:

networks:
  monitor-network:
    driver: bridge
